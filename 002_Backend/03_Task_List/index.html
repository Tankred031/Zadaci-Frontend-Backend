<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista zadataka</title>
    <script src="script.js" defer></script>
</head>
<body style="background-color: black; color: aliceblue; font-family: Arial; padding: 30px;">

    <h1>Lista zadataka</h1>

    <input type="text" id="itemInput" placeholder="Upiši novi zadatak">

    <button onclick="handleAddItem()">Dodaj</button>
    <button onclick="handleDisplayList()">Prikaži listu</button>

    <hr>

    <input type="number" id="removeInput" placeholder="Broj zadatka za brisanje">

    <button onclick="handleRemoveItem()">Obriši</button>

    <h2>Popis:</h2>

    <div id="output"></div>

</body>
</html>
