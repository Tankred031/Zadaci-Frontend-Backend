<!DOCTYPE html>
<html lang="hr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galerija</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>Galerija</h1>
    <div class="gallery">
        <div class="item">
            <img class="thumbnail" src="cat-1.png" alt="kutija s mačkom" onclick="showModal(this)">

            <h2>Šapat</h2>
        </div>

        <div class="item">
            <img class="thumbnail" src="cat-2.png" alt="pauk s mačkom" onclick="showModal(this)">

            <h2>Sjena</h2>
        </div>

        <div class="item">
            <img class="thumbnail" src="cat-3.png" alt="mačka spava" onclick="showModal(this)">

            <h2>Mrki</h2>
        </div>
    </div>
    <div class="modal">
        <span id="modal-close-button" onclick="hideModal()">x</span>

        <img src="" alt="" id="modal-content">
    </div>

    <script src="script.js"></script>
</body>

</html>
