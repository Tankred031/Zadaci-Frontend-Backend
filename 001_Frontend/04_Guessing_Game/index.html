<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guessing Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Igra pogađanja brojeva</h1>

        <p id="feedback"></p>
    </div>
    

    <script src="script.js"></script>
</body>
</html>
